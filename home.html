<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/home.css">
</head>
<body>
<div class="phone">

  <!-- Header -->
  <div class="header">
    <div class="status">
      <span>09:41</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0 1 14 0"/><path d="M4 7a6.5 6.5 0 0 1 9 0"/><circle cx="8.5" cy="10" r="1" fill="#fff" stroke="none"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="#fff" opacity=".45"/><rect x="2" y="2" width="19" height="9" rx="2.2" fill="#fff"/><path d="M24.5 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="#fff" opacity=".5"/></svg>
      </span>
    </div>
    <div class="avatar" tabindex="0"></div>
    <div class="bell" tabindex="0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7.5 2 7.5H4S6 15 6 9z"/><path d="M10 20a2.2 2.2 0 0 0 4 0"/></svg>
    </div>
    <div class="balance-label">Available Balance</div>
    <div class="balance">$450.54</div>
  </div>

  <div class="sheet"></div>

  <!-- Quick actions -->
  <div class="quick">
    <div class="item" tabindex="0">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#6b1fe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5c0-1.7 1.3-3 3-3h11c1.7 0 3 1.3 3 3v8c0 1.7-1.3 3-3 3H7c-1.7 0-3-1.3-3-3v-8z" fill="#ede3ff"/><path d="M4 9.5 15 4l1.5 2.5"/><circle cx="17" cy="13.5" r="1.4" fill="#6b1fe0" stroke="none"/></svg>
      <span>Top Up</span>
    </div>
    <div class="item" tabindex="0">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#6b1fe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="8" fill="#ede3ff"/><path d="M14.5 11.5c-.4-1-1.3-1.5-2.5-1.5-1.3 0-2.2.7-2.2 1.7 0 2.3 4.7 1.2 4.7 3.5 0 1-1 1.8-2.5 1.8-1.2 0-2.2-.6-2.6-1.6M12 8.5v1.5m0 7v1.5" stroke-width="1.5"/><path d="M17 3h5v5M22 3l-5 5"/></svg>
      <span>Send</span>
    </div>
    <div class="item" tabindex="0">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#6b1fe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="14" r="8" fill="#ede3ff"/><path d="M16.5 11.5c-.4-1-1.3-1.5-2.5-1.5-1.3 0-2.2.7-2.2 1.7 0 2.3 4.7 1.2 4.7 3.5 0 1-1 1.8-2.5 1.8-1.2 0-2.2-.6-2.6-1.6M14 8.5v1.5m0 7v1.5" stroke-width="1.5"/><path d="M9 8H4V3M4 8l5-5"/></svg>
      <span>Request</span>
    </div>
    <div class="item" tabindex="0">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#6b1fe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="14" r="8.5" fill="#ede3ff"/><path d="M13 9v5l3 2"/><path d="M3 9h5V4"/><path d="M4.2 9A9.5 9.5 0 0 1 8 5"/></svg>
      <span>History</span>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="h-title" style="top:310px">Payment List</div>

    <div class="grid">
      <div class="cell" tabindex="0"><div class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="6" fill="#f0453c"/><g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M5.5 10a9.5 9.5 0 0 1 13 0"/><path d="M8 12.8a6 6 0 0 1 8 0"/></g><circle cx="12" cy="16" r="1.4" fill="#fff"/></svg>
      </div><span>Internet</span></div>

      <div class="cell" tabindex="0"><div class="tile">
        <svg width="22" height="24" viewBox="0 0 22 24"><path d="M12.5 1 3 13.5h6.5L8.5 23 19 9.5h-6.6z" fill="#f7a22c" stroke="#f7a22c" stroke-width="1" stroke-linejoin="round"/></svg>
      </div><span>Electricity</span></div>

      <div class="cell" tabindex="0"><div class="tile">
        <svg width="26" height="22" viewBox="0 0 26 22"><path d="M3 4h20a1 1 0 0 1 1 1v2.5a3.5 3.5 0 0 0 0 7V17a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-2.5a3.5 3.5 0 0 0 0-7V5a1 1 0 0 1 1-1z" fill="#3ec23a"/><g fill="none" stroke="#f4f1fb" stroke-width="1.6" stroke-linecap="round"><path d="M9 8.5v5M14 6.5v8.5"/><path d="M17 11l2 2-2 2" opacity="0"/></g></svg>
      </div><span>Voucher</span></div>

      <div class="cell" tabindex="0"><div class="tile">
        <svg width="26" height="24" viewBox="0 0 26 24"><path d="M9 5V3.5A1.5 1.5 0 0 1 10.5 2h5A1.5 1.5 0 0 1 17 3.5V5" fill="none" stroke="#1fb6e4" stroke-width="2"/><rect x="2" y="5" width="22" height="16" rx="4" fill="#1fb6e4"/><path d="M13 9.5v7M9.5 13h7" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div><span>Assurance</span></div>

      <div class="cell" tabindex="0"><div class="tile">
        <svg width="22" height="26" viewBox="0 0 22 26"><rect x="2" y="1" width="18" height="24" rx="4.5" fill="#6b1fe0"/><rect x="7.5" y="3.8" width="7" height="1.8" rx=".9" fill="#f4f1fb" opacity=".8"/><circle cx="11" cy="20.5" r="1.4" fill="#f4f1fb"/></svg>
      </div><span>Mobile<br>Credit</span></div>

      <div class="cell" tabindex="0"><div class="tile">
        <svg width="22" height="26" viewBox="0 0 22 26"><path d="M3 2h16v21l-2.7-1.8-2.6 1.8-2.7-1.8-2.6 1.8-2.7-1.8L3 23z" fill="#1d5cf0"/><path d="M13 2l6 5" stroke="#f4f1fb" stroke-width="0"/><g stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M7 8h8M7 12h8"/></g><circle cx="17.5" cy="3.5" r="4" fill="#4a86ff"/></svg>
      </div><span>Bill</span></div>

      <div class="cell" tabindex="0"><div class="tile">
        <svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="#e23ccf" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h3l2 12h12l2-8H6.5" stroke-width="2.2"/><path d="M7 7h15l-2 8H8.5z" fill="#e23ccf" stroke="none"/><circle cx="10" cy="20" r="1.8" fill="#e23ccf" stroke="none"/><circle cx="18" cy="20" r="1.8" fill="#e23ccf" stroke="none"/></svg>
      </div><span>Merchant</span></div>

      <div class="cell" tabindex="0"><div class="tile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#6b1fe0"><rect x="2" y="2" width="9" height="9" rx="3"/><rect x="13" y="2" width="9" height="9" rx="3"/><rect x="2" y="13" width="9" height="9" rx="3"/><rect x="13" y="13" width="9" height="9" rx="3"/></svg>
      </div><span>More</span></div>
    </div>

    <div class="h-title" style="top:548px">Promo &amp; Discount</div>
    <div class="see-more" tabindex="0">See more</div>

    <div class="promos">
      <div class="promo" tabindex="0">
        <div class="deco"></div><div class="deco2"></div><div class="dot"></div>
        <h3>Special Offer for Today's Top Up</h3>
        <p>Get discount for every transaction</p>
      </div>
      <div class="promo cyan" tabindex="0">
        <h3>Sp To</h3>
      </div>
    </div>
  </div>

  <!-- Bottom nav -->
  <div class="nav">
    <svg class="nav-bg" viewBox="0 0 375 92" aria-hidden="true"><path fill="#fff" d="M0 28Q0 0 28 0H126C141 0 145.3 1.2 145.8 5A42 42 0 1 0 229.2 5C229.7 1.2 234 0 249 0H347Q375 0 375 28V92H0Z"/></svg>
    <a class="ni active" href="home.html" aria-label="Home" style="left:34px">
      <svg width="24" height="24" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 20z" fill="#6b1fe0"/></svg>
    </a>
    <a class="ni" href="statistic.html" aria-label="Statistic" style="left:97px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8d86a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M8.5 16v-4M12 16V8M15.5 16v-2.5"/></svg>
    </a>
    <div class="scan" tabindex="0" role="button" aria-label="Scan">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 10V8.5A4.5 4.5 0 0 1 8.5 4H10"/>
        <path d="M20 4h1.5A4.5 4.5 0 0 1 26 8.5V10"/>
        <path d="M26 20v1.5a4.5 4.5 0 0 1-4.5 4.5H20"/>
        <path d="M10 26H8.5A4.5 4.5 0 0 1 4 21.5V20"/>
        <rect x="9" y="10" width="12" height="10" rx="3.5"/>
        <path d="M12 15h6"/>
      </svg>
    </div>
    <a class="ni" href="tranfer.html" aria-label="Transfer" style="right:97px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8d86a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/></svg>
    </a>
    <a class="ni" href="contact.html" aria-label="Contact" style="right:34px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8d86a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6z" transform="translate(0 -1)" /></svg>
    </a>
  </div>
  <div class="home-ind"></div>

</div>
</body>
</html>
