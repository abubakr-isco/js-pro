<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistic</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/home.css">
<link rel="stylesheet" href="./css/statistic.css">
</head>
<body>
<div class="phone stat">

  <!-- Status bar -->
  <div class="status">
    <span>09:41</span>
    <span class="icons">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#1a0b3b"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#1a0b3b" stroke-width="2" stroke-linecap="round"><path d="M1.5 4.2a10 10 0 0 1 14 0"/><path d="M4 7a6.5 6.5 0 0 1 9 0"/><circle cx="8.5" cy="10" r="1" fill="#1a0b3b" stroke="none"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="#1a0b3b" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2.2" fill="#1a0b3b"/><path d="M24.5 4.5v4c.8-.3 1.5-1.1 1.5-2s-.7-1.7-1.5-2z" fill="#1a0b3b" opacity=".45"/></svg>
    </span>
  </div>

  <h1 class="title">Statistic</h1>

  <div class="tb-label">Total Balance</div>
  <div class="tb-value">$21,350.54</div>

  <div class="ov-title">Overview</div>
  <button class="month" type="button">Month
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#1a0b3b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5l4 4 4-4"/></svg>
  </button>

  <!-- Chart -->
  <div class="chart">
      <span class="yl" style="top:273px">40k</span>
      <span class="gl" style="top:282px"></span>
      <span class="yl" style="top:314px">30k</span>
      <span class="gl" style="top:323px"></span>
      <span class="yl" style="top:355px">20k</span>
      <span class="gl" style="top:364px"></span>
      <span class="yl" style="top:396px">10k</span>
      <span class="gl" style="top:405px"></span>
      <span class="yl" style="top:437px">0k</span>
      <span class="gl" style="top:446px"></span>
    <div class="bars">
      <div class="grp" style="left:66.5px;--d:0ms" tabindex="0" aria-label="Jan">
        <i class="bar exp" style="--h:45.5px"></i><i class="bar inc" style="--h:90px"></i>
      </div>
      <div class="grp" style="left:117.5px;--d:70ms" tabindex="0" aria-label="Feb">
        <i class="bar exp" style="--h:72px"></i><i class="bar inc" style="--h:151.5px"></i>
      </div>
      <div class="grp" style="left:168.5px;--d:140ms" tabindex="0" aria-label="Mar">
        <i class="bar exp" style="--h:95.4px"></i><i class="bar inc" style="--h:117px"></i>
      </div>
      <div class="grp" style="left:219.5px;--d:210ms" tabindex="0" aria-label="Apr">
        <i class="bar exp" style="--h:31px"></i><i class="bar inc" style="--h:84px"></i>
      </div>
      <div class="grp" style="left:270.5px;--d:280ms" tabindex="0" aria-label="Jun">
        <i class="bar exp" style="--h:17px"></i><i class="bar inc" style="--h:103.6px"></i>
      </div>
      <div class="grp" style="left:321.0px;--d:350ms" tabindex="0" aria-label="Jul">
        <i class="bar exp" style="--h:72px"></i><i class="bar inc" style="--h:93.4px"></i>
      </div>
    </div>
      <span class="mon" style="left:61.5px">Jan</span>
      <span class="mon" style="left:112.5px">Feb</span>
      <span class="mon" style="left:163.5px">Mar</span>
      <span class="mon" style="left:214.5px">Apr</span>
      <span class="mon" style="left:265.5px">Jun</span>
      <span class="mon" style="left:316.0px">Jul</span>
    <div class="legend">
      <span class="lg"><i class="sq inc"></i>Income</span>
      <span class="lg"><i class="sq exp"></i>Expense</span>
    </div>
  </div>

  <!-- Cards -->
  <div class="card income" tabindex="0">
    <i class="arc a1"></i><i class="arc a2"></i>
    <i class="circ"></i>
    <svg class="big" width="64" height="80" viewBox="0 0 64 80" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8v64M9 50l23 23 23-23"/></svg>
    <span class="ic"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#1a0b3b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v10M3 8l4 4 4-4"/></svg></span>
    <div class="lab">Income</div>
    <div class="amt">$18,548.99</div>
  </div>
  <div class="card expense" tabindex="0">
    <i class="arc a1"></i><i class="arc a2"></i>
    <i class="circ"></i>
    <svg class="big" width="64" height="80" viewBox="0 0 64 80" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M32 72V8M9 30L32 7l23 23"/></svg>
    <span class="ic"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#6b1fe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V2M3 6l4-4 4 4"/></svg></span>
    <div class="lab">Expense</div>
    <div class="amt">$1,445.93</div>
  </div>

  <!-- Bottom nav -->
  <div class="nav">
    <svg class="nav-bg" viewBox="0 0 375 92" aria-hidden="true"><path fill="#fff" d="M0 28Q0 0 28 0H126C141 0 145.3 1.2 145.8 5A42 42 0 1 0 229.2 5C229.7 1.2 234 0 249 0H347Q375 0 375 28V92H0Z"/></svg>
    <a class="ni" href="home.html" aria-label="Home" style="left:34px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8d86a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 20z"/></svg>
    </a>
    <a class="ni active" href="statistic.html" aria-label="Statistic" style="left:97px">
      <svg width="24" height="24" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="6.5" fill="#6b1fe0"/><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M8 15v-3M12 16V8M16 15v-2"/></g></svg>
    </a>
    <div class="scan" tabindex="0" role="button" aria-label="Scan">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 10V8.5A4.5 4.5 0 0 1 8.5 4H10"/>
        <path d="M20 4h1.5A4.5 4.5 0 0 1 26 8.5V10"/>
        <path d="M26 20v1.5a4.5 4.5 0 0 1-4.5 4.5H20"/>
        <path d="M10 26H8.5A4.5 4.5 0 0 1 4 21.5V20"/>
        <rect x="9" y="10" width="12" height="10" rx="3.5"/>
        <path d="M12 15h6"/>
      </svg>
    </div>
    <a class="ni" href="tranfer.html" aria-label="Transfer" style="right:97px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8d86a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/></svg>
    </a>
    <a class="ni" href="contact.html" aria-label="Contact" style="right:34px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8d86a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6z" transform="translate(0 -1)"/></svg>
    </a>
  </div>
  <div class="home-ind"></div>

</div>
</body>
</html>
